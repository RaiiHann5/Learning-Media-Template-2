<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="flex-shrink-0 w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
      <svg class="w-6 h-6 text-orange-500" fill="currentColor" viewBox="0 0 20 20">

          Introduction to Grammar

        <span class="text-sm px-2 py-1 rounded-full bg-green-100 text-green-700 font-medium">
          Published
        </span>
      </div>
      <p class="text-sm text-gray-500 mb-2">
        📘 12 Chapters • Updated 15 Sep 2025
      </p>
      <p class="text-gray-600 text-sm">

      </p>

  </div>
